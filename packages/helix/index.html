<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mnemo Helix</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body data-mode="emblem">
<header class="bar">
  <div class="brand">
    <img class="brandmark" src="brand-64.png" width="28" height="28" alt="">
    <span class="wordmark">MNEMO</span>
  </div>
  <nav class="seg" aria-label="View">
    <span class="seg-ind" id="seg-ind" aria-hidden="true"></span>
    <button type="button" data-mode="emblem" aria-pressed="true">Emblem</button>
    <button type="button" data-mode="helix" aria-pressed="false">Helix</button>
    <button type="button" data-mode="graph" aria-pressed="false">Graph</button>
    <button type="button" data-mode="read" aria-pressed="false">Read</button>
  </nav>
  <span id="source" class="source"></span>
  <button type="button" id="proposals" class="chip proposal-chip" hidden></button>
  <button type="button" id="fx" class="chip" aria-pressed="true"><span class="fx-icon" aria-hidden="true">✦</span><span id="fx-label">Effects</span></button>
</header>
<main>
  <section class="stage-wrap">
    <canvas id="stage" tabindex="0" role="application" aria-label="Mnemo emblem. Press Enter to open the helix."></canvas>
    <div id="tip" class="tip" hidden></div>
    <section id="detail" class="card" aria-live="off" hidden></section>
    <p id="hint" class="hint">Scroll to travel through time · click a note to focus · double-click to read · Esc to step back</p>
    <section id="reader" class="reader" aria-label="Reader" hidden>
      <div class="reader-bar">
        <button type="button" id="reader-back" class="reader-back"><span aria-hidden="true">←</span> <span id="reader-back-label">Helix</span></button>
        <span id="reader-crumb" class="reader-crumb"></span>
        <span id="reader-tools" class="reader-tools" hidden>
          <button type="button" id="reader-new" class="chip" aria-label="New note">+ Note</button>
          <button type="button" id="reader-new-request" class="chip" aria-label="New request for your agents">+ Request</button>
          <button type="button" id="reader-edit" class="chip reader-edit" hidden>Edit</button>
        </span>
        <button type="button" id="reader-size" class="chip reader-size" aria-label="Text size">Aa</button>
        <span id="reader-progress" class="reader-progress" aria-hidden="true"></span>
      </div>
      <div id="reader-scroll" class="reader-scroll" tabindex="-1">
        <article id="reader-doc" class="reader-doc"></article>
      </div>
    </section>
  </section>
  <aside class="panel" aria-labelledby="list-h">
    <div class="panel-head">
      <h2 id="list-h">Strand</h2>
      <span id="count" class="count"></span>
    </div>
    <p class="panel-sub">Newest first · the same notes as the helix · ↑ ↓ to move</p>
    <div id="strand-scroll" class="strand-scroll">
      <ul id="strand-list" aria-labelledby="list-h"></ul>
    </div>
  </aside>
</main>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script src="graph.js" onerror="void 0"></script>
<script src="app.js"></script>
</body>
</html>
